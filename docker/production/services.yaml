# The services of the example production install (WS-062, WS-079). Not run on its own:
# compose.production.yaml includes it, with the operator's env file as the source of the
# ${...} values below. Paths are relative to the repository root (project_directory).
#
# Each service receives only the variables it reads (WS-079, canonical doc 0006 section 5):
# the app no owner credential, `migrate` only the owner's connection, the database no app
# secret. A variable a service needs must be listed under its `environment:`.

# Every service keeps at most five files of 10 MB of logs (WS-070): Docker's default keeps
# them without limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  build: .
  image: opanel-app:local
  logging: *logging

services:
  db:
    # PostgreSQL 18.7, pinned by digest on 2026-11-25 (WS-126): the same revision always
    # installs the same database. Update it with docs/operations.md, "Updating PostgreSQL";
    # never change the major version (18) on an existing volume.
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: opanel
      POSTGRES_DB: opanel
      # The schema owner's password, used on a new volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The app's role, created by the init script on a new volume (WS-063).
      OPANEL_APP_DB_PASSWORD: ${OPANEL_APP_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/production/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opanel -d opanel"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "dist/migrate.mjs"]
    restart: "no"
    environment:
      # The schema owner's connection, and nothing else (WS-063, WS-079).
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL}
      # Optional: empty means not set.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    ports:
      - "127.0.0.1:${OPANEL_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # An example HTTPS reverse proxy (WS-067), started only with `--profile proxy`. Leave it
  # out if you run your own; docker/production/Caddyfile shows what it must do. It faces the
  # internet and receives only its two settings, none of the app's secrets.
  proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *logging
    environment:
      OPANEL_SITE: ${OPANEL_SITE:-localhost}
      OPANEL_CADDY_TLS: ${OPANEL_CADDY_TLS:-}
    ports:
      - "${OPANEL_HTTP_PORT:-80}:80"
      - "${OPANEL_HTTPS_PORT:-443}:${OPANEL_HTTPS_PORT:-443}"
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  caddy-data:
