# pnpm settings (pnpm 10 reads them from here). The root package is the app; `mcp` is the
# MCP server, a workspace package of its own (doc 0005, WS-099).

packages:
  - mcp

overrides:
  # GHSA-67mh-4wv8-2f99: drizzle-kit 0.31 lists the deprecated @esbuild-kit packages, whose
  # core-utils pins esbuild 0.18. drizzle-kit never loads them; this replaces that esbuild
  # with the patched version drizzle-kit itself uses (WS-053). Remove it with drizzle-kit 1.0.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"

# A pnpm other than the one in `packageManager` stops at once, naming both versions,
# instead of warning and carrying on (WS-060).
packageManagerStrictVersion: true

auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7, ReDoS on attacker-supplied extglob patterns; no fix published.
    # Only path: better-auth's optional peer vitest (our own test runner); Opanel never
    # gives picomatch a pattern from outside the repository. The audit workflow fails
    # once a fix exists (WS-061).
    - GHSA-fc5q-39xc-vjpf
