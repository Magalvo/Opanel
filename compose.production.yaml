# An example production install of Opanel (WS-062, canonical doc 0006). Not for local
# development or CI: that is compose.yaml.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f compose.production.yaml up -d --build
#
# The app is published on this host's loopback interface only: put your HTTPS reverse
# proxy in front of it. `migrate` runs once, before the app starts, and exits.
name: opanel

x-app: &app
  build: .
  image: opanel-app:local
  env_file: ${OPANEL_ENV_FILE:-.env.production}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opanel
      POSTGRES_DB: opanel
    # Reads POSTGRES_PASSWORD (the schema owner's) and OPANEL_APP_DB_PASSWORD (the app's
    # role, created by the init script on a new volume, WS-063) from the same file.
    env_file: ${OPANEL_ENV_FILE:-.env.production}
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/production/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opanel -d opanel"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "dist/migrate.mjs"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPANEL_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # An example HTTPS reverse proxy (WS-067), started only with `--profile proxy`. Leave it
  # out if you run your own; docker/production/Caddyfile shows what it must do. OPANEL_SITE
  # comes from the shell or a `.env` file beside this one, never from the app's env file:
  # the proxy faces the internet and sees none of the app's secrets.
  proxy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      OPANEL_SITE: ${OPANEL_SITE:-localhost}
      OPANEL_CADDY_TLS: ${OPANEL_CADDY_TLS:-}
    ports:
      - "${OPANEL_HTTP_PORT:-80}:80"
      - "${OPANEL_HTTPS_PORT:-443}:${OPANEL_HTTPS_PORT:-443}"
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_started

volumes:
  db-data:
  caddy-data:
