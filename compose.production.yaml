# An example production install of Opanel (WS-062, canonical doc 0006). Not for local
# development or CI: that is compose.yaml. The operations guide, docs/operations.md, explains
# installing, upgrading, backing up and restoring it.
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f compose.production.yaml up -d --build
#
# The app is published on this host's loopback interface only: put your HTTPS reverse
# proxy in front of it. `migrate` runs once, before the app starts, and exits.
#
# The services are in docker/production/services.yaml. The operator's env file is the
# source of their ${...} values, and each service receives only its own (WS-079): the app
# no owner credential, `migrate` only the owner's connection, the database no app secret.
# OPANEL_ENV_FILE names another env file; the proxy's OPANEL_SITE may live in either that
# file or a `.env` beside this one.
name: opanel

include:
  - path: docker/production/services.yaml
    project_directory: .
    env_file: ${OPANEL_ENV_FILE:-.env.production}
